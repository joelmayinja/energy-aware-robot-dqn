      <path d="M80 82 73 60 93 47 108 30 126 36" fill="none" stroke="#087f82" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="80" cy="82" r="6" fill="#fff" stroke="#087f82" stroke-width="3"/>
      <circle cx="73" cy="60" r="6" fill="#fff" stroke="#087f82" stroke-width="3"/>
      <circle cx="93" cy="47" r="6" fill="#fff" stroke="#087f82" stroke-width="3"/>
      <circle cx="108" cy="30" r="6" fill="#fff" stroke="#087f82" stroke-width="3"/>
      <circle cx="126" cy="36" r="5" fill="#ed8455"/>
    </g>

    <g transform="translate(760 226)">
      <rect width="431" height="63" rx="13" fill="#f8faf9" stroke="#e5eeea"/>
      <text x="15" y="20" fill="#788681" font-size="9" font-weight="700" letter-spacing="1">RESEARCH PIPELINE</text>
      <g font-size="10" font-weight="650">
        <rect x="15" y="30" width="93" height="22" rx="11" fill="#e5f3ee"/><text x="27" y="45" fill="#286b5b">Energy data</text>
        <path d="M111 41h12m-4-4 4 4-4 4" fill="none" stroke="#98aaa3" stroke-width="1.5"/>
        <rect x="129" y="30" width="85" height="22" rx="11" fill="#e5f3ee"/><text x="143" y="45" fill="#286b5b">Simulation</text>
        <path d="M217 41h12m-4-4 4 4-4 4" fill="none" stroke="#98aaa3" stroke-width="1.5"/>
        <rect x="235" y="30" width="76" height="22" rx="11" fill="#e5f3ee"/><text x="249" y="45" fill="#286b5b">DQN</text>
        <path d="M314 41h12m-4-4 4 4-4 4" fill="none" stroke="#98aaa3" stroke-width="1.5"/>
        <rect x="332" y="30" width="84" height="22" rx="11" fill="#fff0e8"/><text x="346" y="45" fill="#a65c3b">Edge · planned</text>
      </g>
