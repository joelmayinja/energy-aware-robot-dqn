    <circle cx="1167" cy="70" r="4" fill="#ed8455"/>
    <text x="1178" y="74" fill="#788681" font-size="10">SIMULATED SIGNALS</text>

    <g transform="translate(760 100)">
      <rect width="195" height="107" rx="13" fill="#f3f8f6" stroke="#e5eeea"/>
      <text x="15" y="22" fill="#778680" font-size="10" font-weight="650">GRID DRAW · SIMULATED</text>
      <path d="M17 81h160M17 58h160M17 35h160" stroke="#e1ebe6" stroke-width="1"/>
      <path d="M20 74c19-4 23-25 41-21s21 22 38 11 19-25 35-18 25-2 42-19" fill="none" stroke="#ed9a65" stroke-width="3" stroke-linecap="round"/>
