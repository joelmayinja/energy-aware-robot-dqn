<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title description">
  <title id="title">Energy-aware robot control research</title>
  <desc id="description">A simulated robot arm, energy chart, and research pipeline from steel-industry data to a planned lightweight edge controller.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0f8f5"/>
      <stop offset="1" stop-color="#e4f0ed"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#f7fbf9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#174d48" flood-opacity=".10"/>
    </filter>
  </defs>
  <rect width="1280" height="360" rx="26" fill="url(#background)"/>
  <circle cx="1160" cy="12" r="205" fill="#d7ebe5" opacity=".55"/>
  <circle cx="1005" cy="338" r="150" fill="#d7ebe5" opacity=".42"/>
  <path d="M0 302c175-45 278 25 428-8s263-38 404-2 273 39 448-5v73H0Z" fill="#dcece6" opacity=".72"/>

  <g font-family="Segoe UI, Arial, sans-serif">
