    <text x="82" y="62" fill="#087f82" font-size="13" font-weight="700" letter-spacing="3">RESEARCH PROTOTYPE</text>
    <text x="80" y="116" fill="#172a2c" font-size="38" font-weight="750" letter-spacing="-1.5">Energy-aware robot control</text>
    <text x="82" y="151" fill="#526561" font-size="17">Lightweight Deep Q-Learning · KUKA iiwa simulation</text>
    <text x="82" y="183" fill="#70807b" font-size="13">Mayinja Joel  ·  Uganda Christian University</text>

    <g transform="translate(82 222)">
      <rect width="145" height="35" rx="17.5" fill="#fff" opacity=".95"/>
      <circle cx="19" cy="17.5" r="5" fill="#26a27d"/>
      <text x="33" y="22" fill="#35524b" font-size="12" font-weight="650">Simulation-first</text>
      <rect x="156" width="144" height="35" rx="17.5" fill="#fff" opacity=".95"/>
      <path d="M176 22l6-9 5 5 7-11" fill="none" stroke="#087f82" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="202" y="22" fill="#35524b" font-size="12" font-weight="650">Energy-aware</text>
      <rect x="311" width="128" height="35" rx="17.5" fill="#fff" opacity=".95"/>
      <path d="M330 11h12v13h-12zM333 8h6" fill="none" stroke="#ed8455" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="350" y="22" fill="#35524b" font-size="12" font-weight="650">Edge planned</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="720" y="44" width="500" height="270" rx="22" fill="url(#card)" stroke="#dce9e4"/>
